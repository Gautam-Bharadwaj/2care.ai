# Fly.io — FastAPI backend (twocare-backend)
#
# Deploy:
#   fly deploy --config infra/fly.backend.toml --dockerfile infra/Dockerfile.backend
#
# This is the public HTTP surface: /traces, /metrics/latency, /healthz,
# /patients, /appointments, etc. The agent worker and Celery worker
# both call into this app over the .internal network — keep them in the
# same region.
#
# Stateless. Horizontally scalable. `fly scale count 2 -a twocare-backend`
# adds a second machine; sessions are not held in process so there is
# nothing to drain.

app = "twocare-backend"
primary_region = "bom"   # Mumbai — closest Fly region to MedFirst, Banjara Hills

[build]
  dockerfile = "Dockerfile.backend"

[env]
  BACKEND_HOST = "0.0.0.0"
  BACKEND_PORT = "8000"
  # Internal DNS — the agent and worker apps reach the backend via this hostname.
  # Public traffic still goes through fly.dev / a custom domain.
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Keep at least one machine warm — the agent and worker hammer
  # /traces and /memory/recall and a cold start adds 1-2s to the first
  # request which would blow the 450ms latency budget on call setup.
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "get"
    # The cheap probe — /health returns {"status":"ok"} without touching
    # DB/Redis. For deep health use /healthz (DB + Redis + provider freshness).
    path = "/health"

[[services]]
  protocol = "tcp"
  internal_port = 8000
  # Concurrency tuned for the lightweight JSON endpoints we serve. Tools
  # like /traces are read-heavy and FastAPI on uvicorn handles ~200 rps
  # per machine before tail latency spikes.
  [services.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[processes]
  app = "twocare-backend"

# Migrations run automatically before each new machine boots traffic.
# Idempotent: if HEAD is already deployed, alembic upgrade head is a no-op.
[deploy]
  release_command = "alembic upgrade head"
