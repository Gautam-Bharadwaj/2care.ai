# Fly.io configuration for the FastAPI backend.
# Deploy with: fly deploy --config infra/fly.toml --dockerfile infra/Dockerfile.backend
#
# The agent worker registers with LiveKit Cloud and is typically deployed as a
# separate Fly app (or run on LiveKit's worker hosting). Copy this file to
# fly.agent.toml and swap the dockerfile/cmd to deploy the agent the same way.

app = "twocare-backend"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile.backend"

[env]
  BACKEND_HOST = "0.0.0.0"
  BACKEND_PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
