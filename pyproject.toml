[project]
name = "twocare"
version = "0.1.0"
description = "Real-time multilingual voice AI agent for clinical appointment booking"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32",
    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pgvector>=0.3",
    # Queue + cache
    "redis>=5.2",
    "celery[redis]>=5.4",
    # LiveKit voice pipeline
    "livekit-agents>=1.0",
    "livekit-plugins-deepgram>=1.0",
    "livekit-plugins-cartesia>=1.0",
    "livekit-plugins-silero>=1.0",
    "livekit-plugins-openai>=1.0",
    "livekit-plugins-groq>=1.0",
    "livekit-api>=1.0",
    # Config + logging
    "python-dotenv>=1.0",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    # HTTP client (agent -> backend)
    "httpx>=0.27",
    "livekit-plugins-turn-detector>=1.5.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
twocare-agent = "agent.main:main"
twocare-backend = "backend.main:main"
twocare-worker = "workers.celery_app:main"
twocare-beat = "workers.celery_app:beat"
twocare-seed = "backend.db.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "backend", "workers"]

[tool.hatch.build.targets.wheel.force-include]
"config.py" = "config.py"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
